name: Update Free VPN Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download sources
        shell: bash
        run: |
          set -e

          download() {
            URL="$1"
            OUTPUT="$2"

            echo "Downloading: $URL"

            if curl -L --fail --retry 3 \
              --connect-timeout 15 \
              --max-time 60 \
              -A "LightVPN-Feed/1.0" \
              "$URL" \
              -o "$OUTPUT"; then

              echo "OK: $OUTPUT"
              return 0

            else
              echo "WARNING: Failed: $URL"
              rm -f "$OUTPUT"
              return 1
            fi
          }

          # Source 1
          download \
            "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/data/light/configs.txt" \
            source1.txt || true

          # Source 2
          download \
            "https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub" \
            source2.txt || true

          echo ""
          echo "Downloaded files:"
          ls -lh source*.txt 2>/dev/null || true

      - name: Build subscription
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          files = [
              "source1.txt",
              "source2.txt",
          ]

          servers = []

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"Skipping missing file: {filename}")
                  continue

              raw = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).strip()

              if not raw:
                  print(f"Skipping empty file: {filename}")
                  continue

              print(f"Processing: {filename}")

              # Plain text
              if re.search(
                  r'(?m)^(vless|vmess|trojan)://',
                  raw
              ):
                  text = raw

              else:
                  # Base64
                  try:
                      normalized = re.sub(
                          r'\s+',
                          '',
                          raw
                      )

                      normalized += '=' * (
                          -len(normalized) % 4
                      )

                      text = base64.b64decode(
                          normalized
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                  except Exception as e:
                      print(
                          f"Could not decode {filename}: {e}"
                      )
                      continue

              for line in text.splitlines():
                  line = line.strip()

                  if line.startswith((
                      "vless://",
                      "vmess://",
                      "trojan://"
                  )):
                      servers.append(line)

          # Remove duplicates while preserving order
          unique = list(dict.fromkeys(servers))

          print(
              f"Collected {len(unique)} unique servers."
          )

          if not unique:
              raise SystemExit(
                  "No valid VPN servers found from any source."
              )

          Path("sub").write_text(
              "\n".join(unique) + "\n",
              encoding="utf-8"
          )

          print("Created subscription file: sub")
          PY

      - name: Commit updated feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update free VPN feed"
          git push
